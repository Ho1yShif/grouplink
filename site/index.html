<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' https:; style-src 'sha256-D/8ICRZyJ5dZWhK5VuPpZKve+TRxSIJEOwrTMVo0grM='; script-src 'sha256-nsmyq4665IeAl+Jlo+x36bCB9QoTOCItVFJQEtSIlhM='; font-src 'self'; base-uri 'none'; form-action 'none'">
<title>Render — links</title>
<meta name="description" content="The fastest path to production for full-stack applications and agents">
<meta property="og:title" content="Render — links">
<meta property="og:description" content="The fastest path to production for full-stack applications and agents">
<meta property="og:type" content="website">
<link rel="icon" href="/assets/render-logomark-black.svg" media="(prefers-color-scheme: light)">
<link rel="icon" href="/assets/render-logomark-white.svg" media="(prefers-color-scheme: dark)">
<style>
@font-face {
  font-family: 'Roobert';
  src: url('/assets/fonts/RoobertVF.woff2') format('woff2-variations');
  font-weight: 300 500;
  font-display: swap;
}
@font-face {
  font-family: 'PP Neue Montreal';
  src: url('/assets/fonts/PPNeueMontreal-Variable.woff2') format('woff2-variations');
  font-weight: 300 500;
  font-display: swap;
}
@font-face {
  font-family: 'PP Neue Montreal Mono';
  src: url('/assets/fonts/PPNeueMontrealMono-Medium.woff2') format('woff2');
  font-weight: 500;
  font-display: swap;
}

:root {
  --bg: #ffffff;
  --bg-secondary: #e3e3e3;
  --border: #e3e3e3;
  --text: #0d0d0d;
  --text-secondary: #4d4d4d;
  --text-faint: #6b6b6b;
  --link: #8a05ff;
  --link-hover: #48008c;
  --link-bg: #e7dbff;
  --accent: #8a05ff;
  --accent-strong: #48008c;

  --font-brand: 'Roobert', 'Manrope', ui-sans-serif, system-ui, sans-serif;
  --font-default: 'PP Neue Montreal', 'Manrope', ui-sans-serif, system-ui, sans-serif;
  --font-mono: 'PP Neue Montreal Mono', 'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

  --ease: cubic-bezier(0.9, 0.1, 0.1, 0.9);

  color-scheme: light dark;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d0d0d;
    --bg-secondary: #141414;
    --border: #272727;
    --text: #ffffff;
    --text-secondary: #c7c7c7;
    --text-faint: #b3b3b3;
    --link: #d1b8ff;
    --link-hover: #e7dbff;
    --link-bg: #48008c;
    --accent: #8a05ff;
    --accent-strong: #c29eff;
  }
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-default);
  font-weight: 400;
  font-size: 16px;
  line-height: 24px;
  letter-spacing: 0.01em;
  -webkit-font-smoothing: antialiased;
}

.page {
  max-width: 560px;
  margin: 0 auto;
  padding: 96px 32px 64px;
  display: flex;
  flex-direction: column;
  gap: 40px;
}

.masthead {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 16px;
  /* Adds to the .page gap, so the links start further below the socials. */
  margin-bottom: 48px;
}

.name { margin: 0; }

.logo-link {
  display: block;
  color: var(--text);
}
.logo-link:hover { color: var(--link); }
.logo-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

/*
 * The logo file is solid white, so an <img> would vanish on the light
 * background. It is a mask instead, painted with the text color.
 */
.logo {
  display: block;
  width: 240px;
  height: 46px;
  background-color: currentColor;
  transition: background-color 150ms var(--ease);
  -webkit-mask: url('/assets/render-logo-white.png') center / contain no-repeat;
  mask: url('/assets/render-logo-white.png') center / contain no-repeat;
}

.tagline {
  margin: 0;
  font-size: 18px;
  line-height: 26px;
  color: var(--text-secondary);
  max-width: 40ch;
}

.links { display: flex; flex-direction: column; gap: 12px; }

.card {
  display: grid;
  grid-template-columns: 20px 1fr auto;
  align-items: start;
  gap: 16px;
  padding: 16px;
  border: 1px solid var(--border);
  background: var(--bg);
  text-decoration: none;
  color: inherit;
  min-height: 56px;
}

.card:hover { border-color: var(--text-faint); }
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.card__icon { width: 20px; height: 20px; margin-top: 2px; display: block; }
.card__icon--broken { visibility: hidden; }
.card__title { font-size: 16px; line-height: 24px; }
.card__desc {
  margin: 4px 0 0;
  font-size: 14px;
  line-height: 20px;
  color: var(--text-faint);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card__arrow {
  color: var(--text-faint);
  line-height: 24px;
  transition: transform 150ms var(--ease);
}
.card:hover .card__arrow { transform: translateX(2px); }

.socials {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 20px;
  /* Adds to the .masthead gap, so the icons clear the tagline. */
  margin-top: 8px;
}

.social {
  display: block;
  color: var(--text);
  text-decoration: none;
}
.social:hover { color: var(--link); }
.social:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

/*
 * The icon files are solid white, so an <img> would vanish on the light
 * background. Each one is a mask instead, painted with the text color.
 */
.social__icon {
  display: block;
  width: 24px;
  height: 24px;
  background-color: currentColor;
  -webkit-mask: var(--icon) center / contain no-repeat;
  mask: var(--icon) center / contain no-repeat;
  transition: background-color 150ms var(--ease);
}

.social__icon--youtube { --icon: url('/assets/icons/youtube.svg'); }
.social__icon--linkedin { --icon: url('/assets/icons/linkedin.svg'); }
.social__icon--x { --icon: url('/assets/icons/x.svg'); }
.social__icon--github { --icon: url('/assets/icons/github.svg'); }
.social__icon--discord { --icon: url('/assets/icons/discord.svg'); }

/* A label with no icon file keeps the old wordmark treatment. */
.social--text {
  font-family: var(--font-mono);
  font-weight: 500;
  font-size: 12px;
  line-height: 24px;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  color: var(--link);
}
.social--text:hover { color: var(--link-hover); }

@media (max-width: 767px) {
  .page { padding: 48px 16px 40px; gap: 32px; }
  .masthead { margin-bottom: 28px; }
  .logo { width: 190px; height: 36px; }
  .card { min-height: 44px; }
}

@media (prefers-reduced-motion: reduce) {
  .card__arrow { transition: none; }
  .logo, .social__icon { transition: none; }
}
</style>
</head>
<body>
  <main class="page">
    <header class="masthead">
      <h1 class="name"><a class="logo-link" href="https://dashboard.render.com/" aria-label="Render"><span class="logo"></span></a></h1>
      <p class="tagline">The fastest path to production<br>for full-stack applications and agents</p>
      <nav class="socials" aria-label="Social">
        <a class="social" href="https://www.youtube.com/@render-inc" aria-label="YouTube"><span class="social__icon social__icon--youtube"></span></a>
        <a class="social" href="https://www.linkedin.com/company/renderco" aria-label="LinkedIn"><span class="social__icon social__icon--linkedin"></span></a>
        <a class="social" href="https://x.com/render" aria-label="X"><span class="social__icon social__icon--x"></span></a>
        <a class="social" href="https://github.com/render-oss/sdk" aria-label="GitHub"><span class="social__icon social__icon--github"></span></a>
        <a class="social" href="https://render.com/discord" aria-label="Discord"><span class="social__icon social__icon--discord"></span></a>
      </nav>
    </header>

    <section>
      <div class="links">
      <a class="card" href="https://render.com/startups">
        <img class="card__icon" src="https://render.com/favicon.ico" alt="" loading="lazy">
        <span>
          <span class="card__title">Funded founder? Apply to the Render startup program</span>
          
        </span>
        <span class="card__arrow" aria-hidden="true">&#8594;</span>
      </a>
      <a class="card" href="https://render.com/">
        <img class="card__icon" src="https://render.com/favicon.ico" alt="" loading="lazy">
        <span>
          <span class="card__title">Website</span>
          
        </span>
        <span class="card__arrow" aria-hidden="true">&#8594;</span>
      </a>
      <a class="card" href="https://render.com/tutorials/render-workflows">
        <img class="card__icon" src="https://render.com/favicon.ico" alt="" loading="lazy">
        <span>
          <span class="card__title">Tutorial | Get started with Render Workflows</span>
          
        </span>
        <span class="card__arrow" aria-hidden="true">&#8594;</span>
      </a>
      </div>
    </section>
  </main>
<script>
addEventListener('error', function (event) {
  var el = event.target;
  if (el instanceof HTMLImageElement && el.classList.contains('card__icon')) {
    el.classList.add('card__icon--broken');
  }
}, true);
</script>
</body>
</html>
